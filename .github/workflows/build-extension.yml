name: Build Extension

on:
  push:
    branches:
      - main
    paths:
      - 'packages/extension/**'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Get package info
        id: package
        run: |
          echo "name=$(node -p "require('./packages/extension/package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./packages/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Build extensions
        run: |
          pnpm build
          cd packages/extension
          rm -rf build
          pnpm pack:all

      - name: Commit changes
        if: github.ref == 'refs/heads/main'
        run: |
          git checkout main
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f packages/extension/build/*.zip
          git diff --staged --quiet || (git commit -m "chore: update extension builds [skip ci]" && git push)
